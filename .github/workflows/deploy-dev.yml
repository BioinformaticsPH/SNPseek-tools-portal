name: Build & Deploy — /dev

# Triggers on every push to main.
# The self-hosted runner executes directly on the target server,
# so no SSH keys or remote transfer tools are needed.
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and sync to /dev
    runs-on: self-hosted  # runner registered on brs-snpseek.duckdns.org

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ─────────────────────────────────────────────────────────
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # ── 3. Install ─────────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Build ───────────────────────────────────────────────────────────
      # Vite base is already set to '/dev/' in vite.config.ts,
      # so all asset paths in the output will be correct for this subpath.
      - name: Build (base = /dev/)
        run: npm run build

      # ── 5. Deploy ──────────────────────────────────────────────────────────
      # rsync --delete removes files from /dev that no longer exist in dist/,
      # keeping the directory clean on every deploy.
      # The runner user must have write access to /var/www/html/dev.
      - name: Sync dist/ → /var/www/html/dev
        run: |
          rsync -av --delete dist/ /var/www/html/dev/

      # ── 6. Summary ─────────────────────────────────────────────────────────
      - name: Print deploy summary
        run: |
          echo "✅ Deployed to http://brs-snpseek.duckdns.org/dev/"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
