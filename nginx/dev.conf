# SNP-Seek — /dev staging location block
# ---------------------------------------------------------------------------
# Drop this inside your existing server {} block in your main Nginx config,
# typically at: /etc/nginx/sites-available/brs-snpseek
#
# After adding, reload Nginx:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Staging URL: http://brs-snpseek.duckdns.org/dev/
# Deploy path: /var/www/html/dev/   (synced by GitHub Actions on push to main)
# ---------------------------------------------------------------------------

location /dev/ {
    alias /var/www/html/dev/;
    index index.html;

    # SPA fallback — any path under /dev/ that isn't a real file
    # is served as index.html so React can handle it client-side.
    try_files $uri $uri/ /dev/index.html;

    # Long-lived cache for Vite's content-hashed static assets.
    # Safe because Vite fingerprints every filename (e.g. index-D57mf17N.js).
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        alias /var/www/html/dev/;  # required when nesting location inside alias
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
