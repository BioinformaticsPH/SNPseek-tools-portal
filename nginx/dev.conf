# SNP-Seek — /dev staging location blocks
# ---------------------------------------------------------------------------
# Drop these inside your existing server {} block in your main Nginx config,
# typically at: /etc/nginx/sites-available/brs-snpseek
#
# After adding:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Staging URL: https://brs-snpseek.duckdns.org/dev/
# Deploy path: /var/www/html/dev/   (synced by GitHub Actions on push to main)
# ---------------------------------------------------------------------------

# 1. Redirect /dev (no trailing slash) → /dev/ to avoid a 404.
#    Browsers and tools that omit the slash will be redirected cleanly.
location = /dev {
    return 301 $scheme://$host/dev/;
}

# 2. Cache long-lived Vite assets BEFORE the SPA fallback block.
#    Uses root (not alias) so the full URI maps directly to the filesystem:
#    /dev/assets/index-Abc123.js → /var/www/html/dev/assets/index-Abc123.js
#    This avoids the unreliable nested-alias pattern.
location ~* ^/dev/.+\.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
    root /var/www/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# 3. SPA — serve index.html for any /dev/* path that isn't a real file.
location /dev/ {
    alias /var/www/html/dev/;
    index index.html;
    try_files $uri $uri/ /dev/index.html;
}
